services:
  # 1. Python AI Service
  - type: web
    name: food-analyzer-ai-service
    env: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PORT
        value: 5001

  # 2. Java Spring Boot Backend
  - type: web
    name: food-analyzer-backend
    env: java
    rootDir: backend
    buildCommand: chmod +x mvnw && ./mvnw clean package -DskipTests
    startCommand: java -jar target/food-analyzer-backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: PORT
        value: 8080
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # 3. React Frontend Static Site
  - type: web
    name: food-analyzer-frontend
    env: static
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: build
