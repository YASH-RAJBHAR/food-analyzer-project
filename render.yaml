services:
  # 1. Python AI Service
  - type: web
    name: food-analyzer-ai-service
    runtime: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PORT
        value: 5001

  # 2. Java Spring Boot Backend (Uses backend/Dockerfile with Java 21 & Maven)
  - type: web
    name: food-analyzer-backend
    runtime: docker
    rootDir: backend
    envVars:
      - key: PORT
        value: 8080
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # 3. React Frontend Static Site
  - type: web
    name: food-analyzer-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: build
