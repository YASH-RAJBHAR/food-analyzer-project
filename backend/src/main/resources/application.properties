spring.application.name=FoodAnalyzer

# Listening Port (Reads Render $PORT environment variable)
server.port=${PORT:8080}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# Database Configuration (H2 in-memory by default, dynamic MySQL/PostgreSQL override)
spring.datasource.url=${DATABASE_URL:${MYSQL_URL:jdbc:h2:mem:fooddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.driver-class-name=${MYSQL_DRIVER:org.h2.Driver}
spring.datasource.username=${MYSQL_USER:sa}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# CORS Origin Control
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:*}

# External AI Service & API Integration
spoonacular.api.key=${SPOONACULAR_API_KEY:}
flask.ai.url=${FLASK_AI_URL:http://127.0.0.1:5001/predict}
