<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Outer Ring Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="50%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#FF9F1C"/>
    </linearGradient>

    <!-- Inner Lens Ring Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EC4B6"/>
      <stop offset="100%" stop-color="#20A499"/>
    </linearGradient>

    <!-- Plate Glow & Shading -->
    <radialGradient id="plateGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FFF8F2"/>
      <stop offset="100%" stop-color="#FCEEE2"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FF6B35" flood-opacity="0.35"/>
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2EC4B6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Rounded Container with Warm Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Outer Camera Aperture Ring -->
  <circle cx="256" cy="256" r="185" fill="#172033" opacity="0.95" />
  
  <!-- Outer Teal AI Ring -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#tealGrad)" stroke-width="14" stroke-dasharray="140 30" filter="url(#innerGlow)" />

  <!-- Main Plate Circle -->
  <circle cx="256" cy="256" r="138" fill="url(#plateGlow)" stroke="#FFFFFF" stroke-width="8" />

  <!-- Inner Plate Rim Line -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="#FF6B35" stroke-width="4" stroke-dasharray="8 6" opacity="0.4" />

  <!-- AI Viewfinder Target Corners -->
  <path d="M 160 185 V 160 H 185" stroke="#2EC4B6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 327 160 H 352 V 185" stroke="#2EC4B6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 160 327 V 352 H 185" stroke="#2EC4B6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 327 352 H 352 V 327" stroke="#2EC4B6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Fork (Left) -->
  <g fill="#FF6B35">
    <rect x="210" y="210" width="7" height="60" rx="3.5" />
    <path d="M 200 210 V 232 C 200 240, 227 240, 227 232 V 210 H 220 V 226 H 214 V 210 H 207 V 226 H 200 Z" />
  </g>

  <!-- Knife / Spoon (Right) -->
  <g fill="#FF6B35">
    <rect x="295" y="210" width="7" height="60" rx="3.5" />
    <path d="M 292 210 C 292 210, 312 214, 312 232 C 312 242, 299 245, 299 245 V 210 Z" />
  </g>

  <!-- AI Lens Shutter Sparkles -->
  <path d="M 256 182 L 260 196 L 274 200 L 260 204 L 256 218 L 252 204 L 238 200 L 252 196 Z" fill="#FF9F1C" />
  <path d="M 320 270 L 323 279 L 332 282 L 323 285 L 320 294 L 317 285 L 308 282 L 317 279 Z" fill="#2EC4B6" />
</svg>
