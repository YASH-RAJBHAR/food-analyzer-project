<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A3D" />
      <stop offset="100%" stop-color="#E54E1B" />
    </linearGradient>
    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#36D7C7" />
      <stop offset="100%" stop-color="#1BA396" />
    </linearGradient>
    <linearGradient id="goldStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF00" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Squircle background -->
  <rect x="4" y="4" width="112" height="112" rx="32" fill="url(#orangeGrad)" filter="url(#softGlow)" />

  <!-- Outer Camera Aperture Ring -->
  <circle cx="60" cy="60" r="44" fill="none" stroke="url(#tealGlow)" stroke-width="5" stroke-dasharray="16 6" />

  <!-- Main White Plate Base -->
  <circle cx="60" cy="60" r="35" fill="#FFFFFF" />
  <circle cx="60" cy="60" r="28" fill="#FFF8F0" stroke="#FFE0C8" stroke-width="2" />

  <!-- Fork (Left) -->
  <path d="M 46 40 V 65 M 41 40 V 52 H 51 V 40" stroke="#E54E1B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Knife (Right) -->
  <path d="M 74 40 V 65 M 74 40 C 81 40, 81 52, 74 52" stroke="#E54E1B" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Center AI Lens Camera Eye -->
  <circle cx="60" cy="74" r="5.5" fill="url(#tealGlow)" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- Top Right AI Sparkle Star -->
  <path d="M 88 22 L 90.5 28.5 L 97 L 30.5 31 L 90.5 33.5 L 88 40 L 85.5 33.5 L 79 L 85.5 28.5 Z" fill="url(#goldStar)" />
</svg>
